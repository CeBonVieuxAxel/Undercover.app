    const { useState, useEffect, useRef, useCallback } = React;

    /* =====================================================
       TAURI IPC HELPER
       ===================================================== */
    async function invokeBackend(cmd, args = {}) {
      try {
        if (window.__TAURI__?.core?.invoke) {
          return await window.__TAURI__.core.invoke(cmd, args);
        }
        if (window.__TAURI_INTERNALS__?.invoke) {
          return await window.__TAURI_INTERNALS__.invoke(cmd, args);
        }
        // Dev browser fallback — simulated responses
        return simulateBackend(cmd, args);
      } catch (err) {
        throw new Error(err?.message || String(err));
      }
    }

    function simulateBackend(cmd, args) {
      switch (cmd) {
        case 'get_or_create_identity':
          return {
            device_name: 'Nœud Undercover v0.1 (Navigateur)',
            user_id: 'UC-DEMO-0001',
            public_key_hex: 'a1b2c3d4e5f6' + '0'.repeat(52),
            ed25519_pubkey_hex: 'a1b2c3d4e5f6' + '0'.repeat(52),
            x25519_public_key_hex: 'f6e5d4c3b2a1' + '0'.repeat(52),
            x25519_pubkey_hex: 'f6e5d4c3b2a1' + '0'.repeat(52),
            fingerprint: 'SHA256:a1b2:c3d4:e5f6:0000:0000',
          };
        case 'start_p2p_listener':
          return { is_listening: true, local_port: 9876, local_addr: '127.0.0.1:9876', address: '127.0.0.1:9876', connected_peers: 1 };
        case 'get_p2p_status':
          return { is_listening: true, local_port: 9876, local_addr: '127.0.0.1:9876', address: '127.0.0.1:9876', connected_peers: 1 };
        case 'get_contacts':
          return [];
        case 'add_contact': {
          const rawKey = args.public_key_hex || args.pubkey || '0'.repeat(64);
          const alias = args.alias || `Nœud ${rawKey.slice(0, 6)}…`;
          return {
            id: 'c_' + rawKey.slice(0, 8),
            alias,
            name: alias,
            public_key_hex: rawKey,
            full_key: `ed25519:${rawKey}`,
            key: `${rawKey.slice(0, 6)}…${rawKey.slice(-6)}`,
            key_display: `${rawKey.slice(0, 6)}…${rawKey.slice(-6)}`,
            ip_address: args.ip_address || null,
            port: args.port || 9876,
            status: 'P2P direct',
            online: true,
            last_msg: 'Canal chiffré établi.',
            time: 'À l\'instant',
            added_at: Date.now(),
          };
        }
        case 'delete_contact':
          return true;
        case 'send_p2p_message': {
          const now = Date.now();
          return {
            id: 'sent_' + now,
            sender_id: 'a1b2c3d4e5f6' + '0'.repeat(52),
            sender_pubkey: 'ed25519:' + 'a1b2c3d4e5f6' + '0'.repeat(52),
            text: args.plaintext || args.text || '',
            plaintext: args.plaintext || args.text || '',
            timestamp: now,
            timestamp_ms: now,
            time: new Date(now).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
            verified: true,
          };
        }
        case 'encrypt_message':
          return btoa(args.plaintext || args.text || '');
        case 'decrypt_message':
          return atob(args.cipher_text || args.ciphertext || '');
        default:
          throw new Error(`Commande inconnue : ${cmd}`);
      }
    }

    /* =====================================================
       TOAST SYSTEM
       ===================================================== */
    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((msg, type = 'info', duration = 3500) => {
        const id = Date.now() + Math.random();
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
      }, []);
      return { toasts, addToast };
    }

    function ToastContainer({ toasts }) {
      return (
        <div className="toast-container" aria-live="polite">
          {toasts.map(t => (
            <div key={t.id} className={`toast ${t.type}`} role="alert">
              <span>{t.msg}</span>
            </div>
          ))}
        </div>
      );
    }

    /* =====================================================
       ICONS — via Lucide UMD
       createIcons() cherche data-lucide DANS le node passé,
       donc on wrapp dans un span container.
       ===================================================== */
    function Icon({ name, size = 16 }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        // Reset puis recrée l'icône
        containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
        window.lucide.createIcons({
          nodes: [containerRef.current],
          attrs: { width: String(size), height: String(size), 'stroke-width': '1.75' },
        });
      }, [name, size]);
      return (
        <span
          ref={containerRef}
          style={{
            display: 'inline-flex',
            alignItems: 'center',
            justifyContent: 'center',
            flexShrink: 0,
            width: size,
            height: size,
          }}
        />
      );
    }

    /* =====================================================
       AVATAR — initiales du contact
       ===================================================== */
    function Avatar({ name, size = 36 }) {
      const initials = (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      return (
        <div className="avatar" style={{ width: size, height: size, fontSize: size * 0.4 }}>
          {initials}
        </div>
      );
    }

    /* =====================================================

       ===================================================== */
    function AddContactModal({ onClose, onAdd }) {
      const [alias, setAlias] = useState('');

      const [port, setPort] = useState('9876');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');

      function handleSimulateScan() {
        const demoKeys = [
          { name: "Agent Spectre", key: "a9f28491b3c090d41e7a8c1d44fe11029ab083c761920d3f44e1a0b3c2d1e0f4", ip: "127.0.0.1", port: "9877" },
          { name: "Cipher Ghost", key: "3f4b11209ac87e5244b399a198de76bc0144f23b781290acde34567890123456", ip: "127.0.0.1", port: "9878" },
          { name: "Echo Raven", key: "e7d012b5678a0091cf235b3211aa8876543210fedcba9876543210abcdef0123", ip: "127.0.0.1", port: "9879" },
        ];
        const pick = demoKeys[Math.floor(Math.random() * demoKeys.length)];
        setAlias(pick.name);
        setPubKey(pick.key);
        setIp(pick.ip);
        setPort(pick.port);
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setErr('');
        if (!alias.trim()) return setErr('Le nom est requis.');
        if (!pubKey.trim() || pubKey.trim().length < 32) return setErr('Clé publique invalide (min. 32 chars hex).');
        setLoading(true);
        try {
          const contact = await invokeBackend('add_contact', {
            alias: alias.trim(),
            public_key_hex: pubKey.trim(),
            ip_address: ip.trim() || null,
            port: parseInt(port) || 9876,
          });
          onAdd(contact);
          onClose();
        } catch (e) {
          setErr(e.message || 'Erreur lors de l\'ajout.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box">
            <div className="modal-header">
              <span className="modal-title">Ajouter un contact</span>
              <div style={{ display: 'flex', gap: '0.4rem', alignItems: 'center' }}>
                <button type="button" className="btn-chalk" style={{ fontSize: '0.74rem', padding: '0.2rem 0.5rem' }} onClick={handleSimulateScan}>
                  <Icon name="qr-code" size={13} /> Scan QR
                </button>
                <button className="modal-close" onClick={onClose} aria-label="Fermer">
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>
            <form onSubmit={handleSubmit} className="flex-col gap-3" style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
              <div className="flex-col gap-1" style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                <label className="text-sub">Nom / Alias</label>
                <input className="input-chalk" placeholder="Alice" value={alias} onChange={e => setAlias(e.target.value)} autoFocus />
              </div>
              <div className="flex-col gap-1" style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                <label className="text-sub">Clé publique Ed25519 (hex)</label>
                <input className="input-chalk input-mono" placeholder="a1b2c3d4..." value={pubKey} onChange={e => setPubKey(e.target.value)} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '0.5rem' }}>
                <div className="flex-col gap-1" style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                  <label className="text-sub">Adresse IP (optionnel)</label>
                  <input className="input-chalk input-mono" placeholder="192.168.1.x" value={ip} onChange={e => setIp(e.target.value)} />
                </div>
                <div className="flex-col gap-1" style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                  <label className="text-sub">Port</label>
                  <input className="input-chalk input-mono" style={{ width: 80 }} value={port} onChange={e => setPort(e.target.value)} />
                </div>
              </div>
              {err && <p style={{ color: 'rgba(255,140,140,0.9)', fontSize: '0.82rem' }}>{err}</p>}
              <div style={{ display: 'flex', gap: '0.5rem', justifyContent: 'flex-end' }}>
                <button type="button" className="btn-chalk" onClick={onClose}>Annuler</button>
                <button type="submit" className="btn-chalk btn-chalk-primary" disabled={loading}>
                  {loading ? 'Ajout…' : 'Ajouter'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* =====================================================
       TAB: MESSAGES (liste contacts + chat)
       ===================================================== */
    function MessagesTab({ contacts, identity, addToast }) {
      const [activeContact, setActiveContact] = useState(null);
      const [messages, setMessages] = useState({});
      const [input, setInput] = useState('');
      const [search, setSearch] = useState('');
      const msgEndRef = useRef(null);

      // Listen for incoming P2P messages
      useEffect(() => {
        let unlisten;
        async function listen() {
          if (window.__TAURI__?.event?.listen) {
            unlisten = await window.__TAURI__.event.listen('p2p-message-received', event => {
              const { sender_id, plaintext, timestamp } = event.payload || {};
              if (!sender_id) return;
              setMessages(prev => ({
                ...prev,
                [sender_id]: [...(prev[sender_id] || []), { from: 'them', text: plaintext, time: timestamp || Date.now() }]
              }));
              addToast(`Message de ${sender_id}`, 'info');
            });
          }
        }
        listen();
        return () => { if (unlisten) unlisten(); };
      }, []);

      useEffect(() => {
        msgEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeContact]);

      const filtered = contacts.filter(c =>
        c.alias.toLowerCase().includes(search.toLowerCase()) ||
        c.public_key_hex.toLowerCase().includes(search.toLowerCase())
      );

      async function sendMessage() {
        if (!input.trim() || !activeContact) return;
        const text = input.trim();
        setInput('');
        try {
          await invokeBackend('send_p2p_message', {
            peer_public_key_hex: activeContact.public_key_hex,
            plaintext: text,
          });
          setMessages(prev => ({
            ...prev,
            [activeContact.public_key_hex]: [
              ...(prev[activeContact.public_key_hex] || []),
              { from: 'me', text, time: Date.now() }
            ]
          }));
        } catch (e) {
          addToast('Envoi échoué: ' + e.message, 'error');
        }
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }

      const chatMessages = activeContact ? (messages[activeContact.public_key_hex] || []) : [];

      return (
        <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
          {/* Contact list */}
          <div style={{
            width: activeContact ? '240px' : '100%',
            minWidth: activeContact ? '180px' : undefined,
            flexShrink: 0,
            display: 'flex',
            flexDirection: 'column',
            borderRight: activeContact ? 'var(--border-chalk)' : 'none',
            overflow: 'hidden',
          }}>
            <div className="content-header">
              <h2>Messages</h2>
            </div>
            {/* Search */}
            <div className="search-bar">
              <Icon name="search" size={14} />
              <input placeholder="Rechercher…" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="overflow-y-auto" style={{ flex: 1 }}>
              {filtered.map(c => {
                const lastMsgs = messages[c.public_key_hex] || [];
                const last = lastMsgs[lastMsgs.length - 1];
                return (
                  <div
                    key={c.public_key_hex}
                    className={`contact-item ${activeContact?.public_key_hex === c.public_key_hex ? 'active' : ''}`}
                    onClick={() => setActiveContact(c)}
                  >
                    <Avatar name={c.alias} />
                    <div className="min-w-0 flex-1">
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span style={{ fontWeight: 500, fontSize: '0.9rem' }} className="truncate">{c.alias}</span>
                        {last && <span className="text-sub" style={{ fontSize: '0.7rem', flexShrink: 0 }}>{formatTime(last.time)}</span>}
                      </div>
                      {last
                        ? <p className="text-sub truncate" style={{ fontSize: '0.8rem' }}>{last.from === 'me' ? '→ ' : ''}{last.text}</p>
                        : <p className="text-sub" style={{ fontSize: '0.78rem' }} title={c.public_key_hex}>{c.public_key_hex.slice(0, 20)}…</p>
                      }
                    </div>
                  </div>
                );
              })}
              {filtered.length === 0 && (
                <div className="empty-state" style={{ flex: 'initial', padding: '2rem 1rem' }}>
                  <p>Aucun contact trouvé</p>
                </div>
              )}
            </div>
          </div>

          {/* Chat area */}
          {activeContact && (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
              {/* Chat header */}
              <div className="top-bar">
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                  <button className="icon-btn" onClick={() => setActiveContact(null)} title="Retour" style={{ marginRight: '0.25rem' }}>
                    <Icon name="arrow-left" size={16} />
                  </button>
                  <Avatar name={activeContact.alias} size={30} />
                  <div>
                    <div style={{ fontWeight: 600, fontSize: '0.95rem' }}>{activeContact.alias}</div>
                    <div className="text-sub" style={{ fontSize: '0.72rem' }} title={activeContact.public_key_hex}>
                      {activeContact.public_key_hex.slice(0, 24)}…
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '0.4rem' }}>
                  <div className="status-badge connected">
                    <div className="status-dot online" />
                    E2EE
                  </div>
                </div>
              </div>

              {/* Messages */}
              <div className="messages-area">
                {chatMessages.length === 0 && (
                  <div className="empty-state" style={{ flex: 1 }}>
                    <Icon name="lock" size={32} />
                    <h3>Chiffrement de bout en bout</h3>
                    <p>Vos messages sont chiffrés avec AES-256-GCM. Commencez la conversation.</p>
                  </div>
                )}
                {chatMessages.map((m, i) => (
                  <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.from === 'me' ? 'flex-end' : 'flex-start' }}>
                    <div className={`message-bubble ${m.from === 'me' ? 'sent' : 'received'}`}>
                      {m.text}
                    </div>
                    <span className="message-meta">{formatTime(m.time)}</span>
                  </div>
                ))}
                <div ref={msgEndRef} />
              </div>

              {/* Input */}
              <div className="input-bar">
                <textarea
                  rows={1}
                  placeholder="Message chiffré…"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                />
                <button className="btn-chalk btn-chalk-primary" onClick={sendMessage} disabled={!input.trim()} title="Envoyer (Entrée)">
                  <Icon name="send" size={14} />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =====================================================
       TAB: GROUPES
       ===================================================== */
    function GroupesTab({ contacts, addToast }) {
      const [groups, setGroups] = useState([]);
      const [showCreate, setShowCreate] = useState(false);
      const [newGroupName, setNewGroupName] = useState('');
      const [selectedMembers, setSelectedMembers] = useState([]);

      function createGroup() {
        if (!newGroupName.trim()) return;
        const g = {
          id: Date.now(),
          name: newGroupName.trim(),
          members: selectedMembers,
          createdAt: Date.now(),
        };
        setGroups(prev => [...prev, g]);
        setNewGroupName('');
        setSelectedMembers([]);
        setShowCreate(false);
        addToast(`Groupe "${g.name}" créé`, 'success');
      }

      function toggleMember(c) {
        setSelectedMembers(prev =>
          prev.find(m => m.public_key_hex === c.public_key_hex)
            ? prev.filter(m => m.public_key_hex !== c.public_key_hex)
            : [...prev, c]
        );
      }

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <div className="content-header">
            <h2>Groupes</h2>
            <button className="btn-chalk" onClick={() => setShowCreate(true)}>
              <Icon name="plus" size={14} /> Créer
            </button>
          </div>

          <div className="overflow-y-auto" style={{ flex: 1, padding: '0.5rem 0.75rem' }}>
            {groups.length === 0 ? (
              <div className="empty-state">
                <Icon name="users" size={40} />
                <h3>Aucun groupe</h3>
                <p>Créez un groupe pour discuter avec plusieurs contacts à la fois.</p>
              </div>
            ) : (
              groups.map(g => (
                <div key={g.id} className="card-chalk" style={{ padding: '0.75rem', marginBottom: '0.5rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                    <div className="avatar" style={{ background: 'rgba(255,255,255,0.07)' }}>
                      <Icon name="users" size={16} />
                    </div>
                    <div>
                      <div style={{ fontWeight: 600 }}>{g.name}</div>
                      <div className="text-sub">{g.members.length} membre{g.members.length !== 1 ? 's' : ''}</div>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>

          {showCreate && (
            <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowCreate(false)}>
              <div className="modal-box">
                <div className="modal-header">
                  <span className="modal-title">Nouveau groupe</span>
                  <button className="modal-close" onClick={() => setShowCreate(false)}><Icon name="x" size={16} /></button>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  <input className="input-chalk" placeholder="Nom du groupe" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} autoFocus />
                  <div>
                    <p className="text-sub" style={{ marginBottom: '0.5rem' }}>Membres ({selectedMembers.length}/{contacts.length})</p>
                    {contacts.length === 0 ? (
                      <p className="text-sub" style={{ fontSize: '0.82rem' }}>Aucun contact disponible.</p>
                    ) : (
                      contacts.map(c => (
                        <div
                          key={c.public_key_hex}
                          className="contact-item"
                          style={{ marginBottom: '0.25rem', userSelect: 'none' }}
                          onClick={() => toggleMember(c)}
                        >
                          <div style={{
                            width: 18, height: 18,
                            border: '1.5px solid var(--chalk-border)',
                            borderRadius: 4,
                            background: selectedMembers.find(m => m.public_key_hex === c.public_key_hex)
                              ? 'rgba(255,255,255,0.18)' : 'transparent',
                            flexShrink: 0,
                          }} />
                          <Avatar name={c.alias} size={28} />
                          <span style={{ fontSize: '0.9rem' }}>{c.alias}</span>
                        </div>
                      ))
                    )}
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem', justifyContent: 'flex-end' }}>
                    <button className="btn-chalk" onClick={() => setShowCreate(false)}>Annuler</button>
                    <button className="btn-chalk btn-chalk-primary" onClick={createGroup} disabled={!newGroupName.trim()}>
                      Créer le groupe
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

                <div key={k} style={{ display: 'flex', justifyContent: 'space-between', paddingBottom: '0.3rem', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                  <span className="text-sub">{k}</span>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.74rem', color: 'var(--chalk-mono)' }}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Contacts summary */}
          <div className="panel-widget">
            <div className="panel-widget-title">Contacts ({contacts.length})</div>
            {contacts.slice(0, 5).map(c => (
              <div key={c.public_key_hex} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.3rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                <Avatar name={c.alias} size={24} />
                <span style={{ fontSize: '0.82rem' }} className="truncate">{c.alias}</span>
              </div>
            ))}
            {contacts.length > 5 && (
              <div className="text-sub" style={{ fontSize: '0.75rem', marginTop: '0.3rem' }}>+{contacts.length - 5} autres</div>
            )}
          </div>
        </>
      );
    }

    /* =====================================================
       MAIN APP COMPONENT
       ===================================================== */
    function App() {
      const [identity, setIdentity] = useState(null);
      const [contacts, setContacts] = useState([]);
      const [p2pStatus, setP2pStatus] = useState(null);
      const [activeTab, setActiveTab] = useState('connexions');
      const [theme, setTheme] = useState('dark');
      const [enterpriseActive, setEnterpriseActive] = useState(false);
      const [loading, setLoading] = useState(true);
      const { toasts, addToast } = useToasts();

      /* ————— RÈGLE DE NAVIGATION CONDITIONNELLE (ABSOLUE) —————
         0 contacts → uniquement "connexions" et "parametres"
         ≥1 contacts → tous les onglets
         ——————————————————————————————————————————————————————— */
      const hasContacts = contacts.length > 0;

      // All possible tabs
      const ALL_TABS = [
        { id: 'messages',    label: 'Messages',    icon: 'message-circle' },
        { id: 'groupes',     label: 'Groupes',     icon: 'users' },
        { id: 'connexions',  label: 'Connexions',  icon: 'wifi' },
        { id: 'parametres',  label: 'Paramètres',  icon: 'settings' },
      ];

      // Visible tabs = conditionally filtered
      const visibleTabs = hasContacts
        ? ALL_TABS
        : ALL_TABS.filter(t => t.id === 'connexions' || t.id === 'parametres');

      // If current tab was hidden, redirect to connexions
      useEffect(() => {
        if (!visibleTabs.find(t => t.id === activeTab)) {
          setActiveTab('connexions');
        }
      }, [hasContacts]);

      // Apply theme to body
      useEffect(() => {
        document.body.className = theme === 'rose' ? 'theme-rose' : '';
      }, [theme]);

      // Boot sequence
      useEffect(() => {
        async function init() {
          try {
            const id = await invokeBackend('get_or_create_identity');
            setIdentity(id);
          } catch (e) {
            addToast('Identité: ' + e.message, 'error');
          }
          try {
            const status = await invokeBackend('start_p2p_listener', { port: 9876 });
            setP2pStatus({
              is_listening: true,
              address: status?.address || status?.local_addr || '127.0.0.1:9876',
              connected_peers: status?.connected_peers || 1,
            });
          } catch (e) {
            setP2pStatus({ is_listening: false });
          }
          try {
            const ctcts = await invokeBackend('get_contacts');
            setContacts(Array.isArray(ctcts) ? ctcts : []);
          } catch (e) {
            addToast('Contacts: ' + e.message, 'error');
          }
          setLoading(false);
        }
        init();
      }, []);

      function handleAddContact(contact) {
        setContacts(prev => {
          if (prev.find(c => c.public_key_hex === contact.public_key_hex)) return prev;
          return [...prev, contact];
        });
      }

      async function handleDeleteContact(contact) {
        try {
          await invokeBackend('delete_contact', { key_or_id: contact.public_key_hex });
        } catch (err) {
          console.warn("Échec suppression contact :", err);
        }
        setContacts(prev => prev.filter(c => c.public_key_hex !== contact.public_key_hex));
        addToast(`Connexion avec "${contact.alias}" supprimée`, 'info');
      }

      function renderTabContent() {
        switch (activeTab) {
          case 'messages':
            return <MessagesTab contacts={contacts} identity={identity} addToast={addToast} />;
          case 'groupes':
            return <GroupesTab contacts={contacts} addToast={addToast} />;
          case 'connexions':
            return (
              <ConnexionsTab
                contacts={contacts}
                p2pStatus={p2pStatus}
                identity={identity}
                onAddContact={handleAddContact}
                onDeleteContact={handleDeleteContact}
                addToast={addToast}
              />
            );
          case 'parametres':
            return (
              <ParamètresTab
                identity={identity}
                theme={theme}
                onThemeToggle={() => setTheme(t => t === 'rose' ? 'dark' : 'rose')}
                enterpriseActive={enterpriseActive}
                onToggleEnterprise={() => {
                  setEnterpriseActive(prev => {
                    const next = !prev;
                    addToast(next ? "Perks Entreprise activés (2,99€/mois) !" : "Abonnement Entreprise résilié.", next ? "success" : "info");
                    return next;
                  });
                }}
                addToast={addToast}
              />
            );
          default:
            return null;
        }
      }

      if (loading) {
        return (
          <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '1rem', background: 'var(--chalk-bg)' }}>
            <div style={{ fontFamily: 'var(--font-chalk)', fontSize: '2.5rem', color: 'var(--chalk-title)', letterSpacing: '0.05em' }}>Undercover</div>
            <div className="text-sub" style={{ fontSize: '0.85rem' }}>Initialisation du système cryptographique…</div>
            <div style={{ width: 48, height: 2, background: 'rgba(255,255,255,0.08)', borderRadius: 1, overflow: 'hidden', marginTop: '0.5rem' }}>
              <div style={{ height: '100%', width: '40%', background: 'rgba(255,255,255,0.3)', borderRadius: 1, animation: 'slide 1.2s ease-in-out infinite alternate' }} />
            </div>
            <style>{`@keyframes slide { from{transform:translateX(-100%)} to{transform:translateX(300%)} }`}</style>
          </div>
        );
      }

      return (
        <div className="app-shell">
          {/* ==========================================
              TOP BAR (always visible)
              ========================================== */}
          <div className="top-bar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
              <span className="top-bar-title">Undercover</span>
              {identity && (
                <span className="status-badge connected" style={{ fontSize: '0.68rem' }}>
                  <div className="status-dot online" />
                  {identity.user_id}
                </span>
              )}
            </div>
            <div className="top-bar-actions">
              <div className={`status-badge ${p2pStatus?.is_listening ? 'connected' : ''}`} style={{ fontSize: '0.72rem' }}>
                <Icon name={p2pStatus?.is_listening ? 'wifi' : 'wifi-off'} size={12} />
                {p2pStatus?.is_listening ? 'P2P actif' : 'Hors ligne'}
              </div>
            </div>
          </div>

          {/* ==========================================
              APP BODY
              ========================================== */}
          <div className="app-body">
            {/* LEFT SIDEBAR (≥650px) */}
            <nav className="sidebar-nav">
              {/* App identity */}
              <div style={{ padding: '0.3rem 0.5rem 0.75rem', borderBottom: 'var(--border-chalk)', marginBottom: '0.25rem' }}>
                <div className="text-sub" style={{ fontSize: '0.7rem', letterSpacing: '0.08em' }}>NAVIGATION</div>
              </div>

              {visibleTabs.map(tab => (
                <div
                  key={tab.id}
                  className={`nav-item ${activeTab === tab.id ? 'active' : ''}`}
                  onClick={() => setActiveTab(tab.id)}
                  role="button"
                  tabIndex={0}
                  onKeyDown={e => e.key === 'Enter' && setActiveTab(tab.id)}
                  aria-current={activeTab === tab.id ? 'page' : undefined}
                >
                  <Icon name={tab.icon} size={16} />
                  <span>{tab.label}</span>
                </div>
              ))}

              {/* Bottom of sidebar — contacts count */}
              <div style={{ marginTop: 'auto', paddingTop: '0.75rem', borderTop: 'var(--border-chalk)' }}>
                <div className="text-sub" style={{ fontSize: '0.72rem', padding: '0.3rem 0.5rem' }}>
                  {contacts.length} contact{contacts.length !== 1 ? 's' : ''}
                </div>
              </div>
            </nav>

            {/* MAIN CONTENT */}
            <main className="main-content" role="main">
              {renderTabContent()}
            </main>

            {/* RIGHT DETAIL PANEL (≥1200px) */}
            <aside className="detail-panel" aria-label="Panneau de détails">
              <DetailPanel identity={identity} p2pStatus={p2pStatus} contacts={contacts} />
            </aside>
          </div>

          {/* ==========================================
              BOTTOM NAV (<650px)
              ========================================== */}
          <nav className="bottom-nav" role="navigation" aria-label="Navigation principale">
            {visibleTabs.map(tab => (
              <div
                key={tab.id}
                className={`bottom-nav-item ${activeTab === tab.id ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.id)}
                role="button"
                tabIndex={0}
                onKeyDown={e => e.key === 'Enter' && setActiveTab(tab.id)}
                aria-current={activeTab === tab.id ? 'page' : undefined}
              >
                <Icon name={tab.icon} size={20} />
                <span>{tab.label}</span>
              </div>
            ))}
          </nav>

          {/* TOAST CONTAINER */}
          <ToastContainer toasts={toasts} />
        </div>
      );
    }

    /* =====================================================
       RENDER
       ===================================================== */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
