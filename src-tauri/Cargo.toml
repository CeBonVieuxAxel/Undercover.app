[package]
name = "undercover-desktop"
version = "0.1.0"
description = "Undercover v0.1-dev Desktop - Messagerie P2P Chiffrée E2EE Windows"
authors = ["Undercover Team"]
edition = "2021"

[lib]
name = "undercover_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Framework Desktop Tauri v2
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2.0"

# Async & Sérialisation
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographie Ed25519 & X25519 (Dalek)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Chiffrement Symétrique & Hachage
aes-gcm = "0.10.3"
rand = "0.8.5"
sha2 = "0.10.8"

# Encodages
hex = "0.4.3"
bs58 = "0.5.1"
base64 = "0.22.1"

# Coffre Sécurisé Windows (Credential Manager / DPAPI)
keyring = { version = "3.2", features = ["windows-native"] }

# Gestion d'erreurs sans unwrap
thiserror = "2.0"
